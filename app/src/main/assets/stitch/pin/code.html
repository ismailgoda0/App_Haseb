<style>
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        background-color: #fbf8ff;
        color: #181a2c;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased flex justify-center items-center min-h-screen">
<div class="w-full max-w-md h-[844px] bg-surface flex flex-col justify-between relative overflow-hidden shadow-2xl" id="security-pin-lock-root">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-margin-mobile pt-10 pb-3 w-full bg-surface">
<button aria-label="إغلاق الورديّة والمطابقة" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-on-surface">إغلاق الورديّة والمطابقة</h1>
<button aria-label="السجل" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined">history</span>
</button>
</header>
<!-- Main Security Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
<!-- Brand Icon / Security Shield -->
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-primary mb-6 shadow-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<!-- Title & Subtitle -->
<h2 class="text-headline-md font-headline-md text-on-surface mb-2">قفل الأمان</h2>
<p class="text-body-md font-body-md text-secondary max-w-[280px] mb-8">أدخل رمز PIN لتأكيد فتح دفتر المحافظ</p>
<!-- PIN Indicators -->
<div class="flex items-center justify-center gap-4 mb-10" id="pin-indicators">
<div class="w-4 h-4 rounded-full bg-surface-container-high transition-all duration-200" data-index="0"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-high transition-all duration-200" data-index="1"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-high transition-all duration-200" data-index="2"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-high transition-all duration-200" data-index="3"></div>
</div>
<!-- 3x4 Numeric Keypad -->
<div class="grid grid-cols-3 gap-4 w-full max-w-[280px] mx-auto mb-6">
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="1">1</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="2">2</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="3">3</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="4">4</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="5">5</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="6">6</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="7">7</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="8">8</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="9">9</button>
<button aria-label="البصمة" class="w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-primary active:scale-95 transition-all mx-auto" id="btn-biometric-unlock">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</button>
<button class="keypad-btn w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-label-numeric font-label-numeric text-on-surface active:scale-95 transition-all mx-auto" data-digit="0">0</button>
<button aria-label="حذف" class="w-16 h-16 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-secondary active:scale-95 transition-all mx-auto" id="btn-keypad-backspace">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
<!-- Quick Actions -->
<div class="flex items-center justify-center gap-6 text-body-sm font-body-sm">
<button class="text-primary hover:underline py-2">نسيت رمز PIN؟</button>
<span class="text-outline-variant">•</span>
<button class="text-secondary hover:underline py-2">تبديل الحساب</button>
</div>
</main>
<!-- Bottom Navigation Bar (Shell) -->

</div>
<script>
        // Micro-interactions for PIN input simulator
        let currentPin = [];
        const indicators = document.querySelectorAll('#pin-indicators > div');
        
        document.querySelectorAll('.keypad-btn').forEach(button => {
            button.addEventListener('click', () => {
                if (currentPin.length < 4) {
                    currentPin.push(button.getAttribute('data-digit'));
                    updateIndicators();
                }
            });
        });

        document.getElementById('btn-keypad-backspace').addEventListener('click', () => {
            if (currentPin.length > 0) {
                currentPin.pop();
                updateIndicators();
            }
        });

        document.getElementById('btn-biometric-unlock').addEventListener('click', () => {
            // Simulate biometric success pulse
            const bioBtn = document.getElementById('btn-biometric-unlock');
            bioBtn.classList.add('bg-primary-container', 'text-on-primary');
            setTimeout(() => {
                bioBtn.classList.remove('bg-primary-container', 'text-on-primary');
            }, 400);
        });

        function updateIndicators() {
            indicators.forEach((ind, index) => {
                if (index < currentPin.length) {
                    ind.classList.remove('bg-surface-container-high');
                    ind.classList.add('bg-primary-container');
                } else {
                    ind.classList.remove('bg-primary-container');
                    ind.classList.add('bg-surface-container-high');
                }
            });
        }
    </script>


</body></html>
